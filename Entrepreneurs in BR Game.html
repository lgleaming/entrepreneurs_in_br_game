<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rise of an Entrepreneur | Industrial Britain</title><style>
:root{--ink:#302619;--muted:#665b49;--paper:#f6f0df;--tan:#e3d1aa;--dark:#203b3b;--gold:#b58335;--line:#c9b99c}*{box-sizing:border-box}body{margin:0;background:#d8ccb5;color:var(--ink);font-family:Georgia, 'Times New Roman',serif;line-height:1.5}header{background:#253c3a;color:#fbefd5;padding:23px 18px;text-align:center;border-bottom:6px solid var(--gold)}header small{letter-spacing:.24em;text-transform:uppercase}h1{font-size:clamp(28px,5vw,48px);line-height:1.1;margin:8px 0}h2{font-size:clamp(23px,3vw,32px);margin:0 0 12px}h3{margin:8px 0}main{max-width:1040px;margin:23px auto;padding:0 15px 30px}.sheet{background:var(--paper);padding:clamp(20px,4vw,36px);border:1px solid #b9a37f;box-shadow:0 9px 20px #493a2130}.topline{font-size:13px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}.dash{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:15px 0 23px}.metric{background:#e9ddc4;border:1px solid #c7b791;padding:10px 7px;text-align:center}.metric b{display:block;font-size:clamp(16px,2.5vw,23px);font-variant-numeric:tabular-nums}.metric span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em}.brief{padding:17px 20px;background:#eee1c9;border-left:5px solid var(--gold);margin:15px 0}.brief h3{margin-top:0}.scene{font-size:17px}.choices{display:grid;gap:11px;margin:18px 0}.choice{display:block;text-align:left;border:1px solid #aa987b;border-radius:3px;background:#fffaf0;padding:15px;color:var(--ink);font:inherit;cursor:pointer}.choice:hover,.choice:focus-visible{background:#f4e6c9;outline:2px solid #96723b}.choice b{display:block;font-size:17px}.choice small{display:block;color:#574c3d;font-size:14px;margin-top:5px}.choice:disabled{opacity:.6;cursor:not-allowed}.btn{background:var(--dark);color:#fff5df;border:0;padding:12px 20px;font:700 15px Georgia,serif;cursor:pointer;border-radius:2px}.btn:hover,.btn:focus-visible{background:#365c58}.btn.secondary{background:#756347}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}.result{border:2px solid #bb9457;padding:18px;background:#fff8e8;margin:16px 0}.event{background:#f0e2ca;border:2px dashed #a06c41;padding:15px;margin-top:15px}.callout{font-size:14px;color:var(--muted)}.roundbadge{background:#d9c397;padding:5px 10px;display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}.intro{font-size:18px}.footnote{font-size:12px;color:#615746;margin-top:28px;border-top:1px solid #bba885;padding-top:12px}.history{width:100%;border-collapse:collapse;font-size:14px}.history th,.history td{border:1px solid #c3b293;padding:9px;vertical-align:top;text-align:left}.history th{background:#ded0b2}.scorepair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.score{background:#e8dcc3;padding:16px;text-align:center;border:1px solid #bdaa88}.score strong{font-size:32px;display:block}.bar{height:10px;background:#c5b99e;margin-top:8px}.bar>div{height:100%;background:#365950}ol{padding-left:22px}.roundillustration{font-size:52px;line-height:1.1;text-align:center;background:#e5d6b7;border:1px solid #c4b292;padding:18px;margin:10px 0 18px;color:#71563d}.historypic{margin:10px 0 18px;text-align:center;background:#ebe1d0;border:1px solid #c4b292;padding:8px}.historypic img{display:block;width:100%;max-height:230px;object-fit:contain;filter:grayscale(100%) sepia(22%)}.historypic figcaption{font-size:12px;color:#615746;margin-top:4px}@media(max-width:680px){.dash{grid-template-columns:repeat(2,1fr)}.dash .metric:last-child{grid-column:1/-1}.scorepair{grid-template-columns:1fr}.history{font-size:12px}.history th,.history td{padding:5px}}@media print{body{background:white}header,.actions,.choices{display:none!important}main{margin:0}.sheet{box-shadow:none;border:0}.footnote{display:none}}</style></head><body><header><small>A Historical Decision-Making Simulation</small><h1>Rise of an Entrepreneur</h1><div>BRITAIN · 1775–1840</div></header><main><div class="sheet" id="game" aria-live="polite"></div></main><script>
'use strict';
const $=document.getElementById('game');
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const money=n=>(n<0?'−':'')+'£'+Math.abs(Math.round(n)).toLocaleString('en-GB');
const D=[
{year:1775,title:'A Risky Beginning',brief:'In the 1770s, Britain had merchants, banks, investors, and an expanding textile trade. Entrepreneurs identified ways to produce and sell more cloth, but expansion required capital: money invested in a business. Loans offered immediate funding but had to be repaid; investors could provide money in exchange for a share of future profits. Property rights and patents also encouraged investment. Your small textile workshop has £1,000 in cash, and demand appears promising. You must decide how to fund future growth before you know whether new technology will pay off.',scenario:()=> 'A merchant tells you that cotton textiles could become a lucrative business. Machines are appearing, but they are costly. How will you finance expansion?',choices:[['Borrow aggressively','Take a £700 loan to enlarge the business. A financing charge applies each round, with £100 principal repaid per later round while cash permits.','You gained purchasing power, but the loan increases your future fixed obligations.',{cash:700,debt:700,prod:5,rep:0,flags:{finance:'loan'}}],['Invite a business partner','Receive £500 from an investor in exchange for 20% of positive future operating earnings.','You avoid bank debt but will share future profits with your investor.',{cash:500,prod:2,flags:{finance:'partner'}}],['Finance growth yourself','Keep control, avoid borrowing, and invest only your own money.','Your business remains independent, although later investments may be harder to afford.',{cash:0,welfare:1,rep:2,flags:{finance:'self'}}]]},
{year:1785,title:'Machines Transform Manufacturing',brief:'Before industrialization, spinning yarn and weaving cloth were often done by hand in homes or small workshops. James Hargreaves’s spinning jenny, introduced in the 1760s, let one operator spin multiple spools. Richard Arkwright’s water frame, patented in 1769, used water-powered machinery for stronger cotton thread and supported factory-scale production. Edmund Cartwright patented a power loom in 1785, but widespread adoption came later. These inventions did different jobs: spinning produces yarn, while weaving turns yarn into fabric. Buying advanced equipment could improve output, but it also required money, maintenance, and changes to employment.',scenario:s=>s.cash<400?'You have limited reserves. Your weavers need more yarn, but the machinery seller wants payment now.':'Your weavers could produce more cloth if the workshop had a steady yarn supply. Competitors are modernizing.',choices:[['Mechanize spinning','Invest £360 in new spinning machinery and trained operators.','Your yarn output rises. The machinery increases future earning potential but adds maintenance demands.',{cash:-360,prod:24,welfare:-6,flags:{tech:'heavy'}}],['Modernize selectively','Spend £190 on smaller mechanization improvements alongside hand production.','You increase capacity more gradually and preserve some flexibility.',{cash:-190,prod:13,welfare:1,rep:1,flags:{tech:'mixed'}}],['Buy yarn from merchants','Spend £90 on supplier arrangements and concentrate on weaving.','Your capital costs are low, but your business becomes dependent on outside yarn suppliers.',{cash:-90,prod:5,welfare:3,rep:1,flags:{tech:'traditional'}}]]},
{year:1795,title:'Powering Industry',brief:'Early British textile mills were often located near rivers because water wheels could drive machinery. Water power could be economical but tied mills to particular sites and changing water levels. Inventors and entrepreneurs, including James Watt and Matthew Boulton, improved and marketed more efficient steam engines. Steam power expanded industrial opportunities, though the engine itself, fuel, installation, and upkeep were costly. Neither water nor steam was automatically the best choice in every location. Your power decision must fit your current business: an extensively mechanized operation has different needs from a small workshop.',scenario:s=>s.flags.tech==='heavy'?'Your new spinning machines could operate longer with dependable power, but the building and engine costs are daunting.':s.flags.tech==='traditional'?'You are less dependent on mechanical power than some competitors. Should you now transform your business, or stay flexible?':'Your combination of machines and hand production is growing. You need to choose how to power the next stage.',choices:[['Build a water-powered mill','Spend £320 on a rural mill and water-wheel installation.','A fixed mill raises productive capacity but exposes you to low river levels.',{cash:-320,prod:18,welfare:-2,flags:{power:'water'}}],['Adopt steam power','Spend £470 installing steam-powered equipment near a manufacturing town.','Steam brings flexibility and strong output, but fuel and upkeep will burden profits.',{cash:-470,prod:25,rep:-1,flags:{power:'steam'}}],['Keep your operation small','Spend £90 on smaller workshops and minor improvements.','Costs stay manageable, but you cannot match large mills in output.',{cash:-90,prod:5,welfare:4,rep:2,flags:{power:'small'}}]]},
{year:1805,title:'The Human Cost',brief:'Factories concentrated workers and machines under the supervision of owners and managers. Industrial work could provide wages, but many textile workers faced long days, dangerous machinery, harsh discipline, and low pay. Children also worked in mills. The 1802 Health and Morals of Apprentices Act attempted to regulate some conditions for apprentices, though enforcement was limited. Entrepreneurs faced competition and payroll expenses, but their labor policies affected people as well as balance sheets. Workers could become exhausted, leave for other employers, or challenge conditions. A financially successful business was not necessarily a socially beneficial one.',scenario:s=>s.welfare<50?'Some workers complain of fatigue and accidents. Recruiting replacements is becoming difficult.':'Production is rising, but competition is putting pressure on your wage bill. You must establish a labor policy.',choices:[['Minimize labor costs','Set long shifts and use low-paid labor, including children, where permitted.','Your expenses fall, but unsafe and exhausting conditions harm workers and weaken public trust.',{cash:150,prod:12,welfare:-25,rep:-14,flags:{labor:'harsh'}}],['Follow common practices','Keep prevailing schedules, with limited safety improvements and supervision.','The business stays competitive but workers still face serious risks.',{cash:-45,prod:5,welfare:0,rep:0,flags:{labor:'ordinary'}}],['Improve conditions','Pay more, reduce excessive hours, restrict child labor, and invest in safety.','Your immediate costs rise, but your workforce becomes healthier and more stable.',{cash:-230,prod:1,welfare:23,rep:15,flags:{labor:'reform'}}]]},
{year:1812,title:'Resistance and Unrest',brief:'In the early nineteenth century, some British textile workers resisted changes that threatened their income and livelihoods. Groups later called Luddites destroyed certain machines and challenged manufacturers; their actions were shaped by economic hardship, employment practices, and grievances, not simply hostility to all technology. The British government treated some machine-breaking as a serious crime. Factory owners faced difficult decisions about security, negotiation, and long-term relations with workers. Your earlier choices matter here: a highly mechanized enterprise, a harsh workplace, and a smaller workshop may face different forms of pressure.',scenario:s=>s.flags.labor==='harsh'?'Your workers protest low wages, long shifts, and unsafe conditions. Production has slowed.':s.flags.tech==='heavy'?'Local craft workers accuse mechanized firms of undermining established livelihoods. There are reports of threats to machinery.':'Competitors face worker unrest and economic pressure. Your business has avoided the worst disruption, but wage demands and market uncertainty are rising.',choices:[['Use strict enforcement','Hire guards, threaten dismissals, and seek government protection.','Production resumes more quickly, but resentment and reputational harm grow.',{cash:-125,prod:8,welfare:-16,rep:-15,flags:{unrest:'force'}}],['Negotiate a settlement','Hear grievances, offer concessions, and adjust some employment practices.','Negotiation costs money but may reduce conflict and improve long-term labor relations.',{cash:-200,prod:1,welfare:15,rep:12,flags:{unrest:'negotiate'}}],['Reorganize production','Change staffing and production methods to limit disruption while maintaining output.','Restructuring creates uncertainty. Some costs fall, but workers have mixed experiences.',{cash:-115,prod:9,welfare:-5,rep:-4,flags:{unrest:'restructure'}}]]},
{year:1820,title:'Cotton and Global Trade',brief:'Britain’s cotton textile industry depended on raw cotton arriving from overseas and on markets at home and abroad. Cotton imported from the United States was increasingly important, and much was produced through the forced labor of enslaved people. British manufacturers benefited from this exploitative global system, even when the exploitation occurred far from their mills. Merchants, ports, insurers, and shipping networks helped connect factories to world markets. At the same time, supply costs, changing demand, and disruptions could undermine a business. This round evaluates commercial strategies; the exploitation behind much of the cotton trade is historical context, not an option students are invited to approve.',scenario:s=>s.cash<200?'Cash reserves are weak and merchants want prompt payment. You must choose between risky bulk purchasing and a smaller market.':'A Liverpool cotton merchant offers several purchasing arrangements. You must decide how much supply and sales risk to accept.',choices:[['Large overseas contract','Commit £300 to bulk cotton supplies and pursue export customers.','Potential sales rise, but you become more exposed to overseas demand and shipping disruptions.',{cash:-300,prod:17,rep:1,flags:{trade:'bulk'}}],['Diversify suppliers','Spend £180 developing relationships with multiple merchants and markets.','The supply network is more flexible, although diversified purchasing adds costs.',{cash:-180,prod:11,rep:4,flags:{trade:'diverse'}}],['Concentrate locally','Spend £70 on small regular purchases and established British buyers.','You avoid much international market exposure but limit your scale.',{cash:-70,prod:3,welfare:1,flags:{trade:'local'}}]]},
{year:1830,title:'The Railway Revolution',brief:'Improved roads and canals had already helped British producers move raw materials and finished goods. Steam-powered railways introduced new possibilities. In 1830, the Liverpool and Manchester Railway opened, connecting two major industrial and commercial centers. George Stephenson became associated with the development of practical locomotives and rail systems, building on work by others. Railways could speed shipments and expand markets, but businesses still had to consider rates, locations, contracts, and existing canal routes. Rail transportation grew unevenly: a manufacturer’s best decision depended on its customers, scale, and access to the network.',scenario:s=>s.flags.trade==='bulk'?'Your overseas customers demand predictable deliveries to port. New railway services look tempting but require a larger commitment.':'A railway is opening new possibilities, but canal merchants offer competitive terms. How will you distribute your goods?',choices:[['Commit to railway freight','Spend £260 securing rail-based distribution and selling to distant markets.','You improve reach and delivery speed but assume more expense and market exposure.',{cash:-260,prod:17,rep:3,flags:{transport:'rail'}}],['Keep canals and roads','Spend £80 improving familiar routes and established shipping relationships.','Transport stays predictable and less capital-intensive, though expansion is slower.',{cash:-80,prod:6,rep:1,flags:{transport:'canal'}}],['Use a mixed network','Spend £170 using rail selectively while retaining canal and road shipping.','You gain flexibility and broaden some markets without relying on one system.',{cash:-170,prod:11,rep:3,flags:{transport:'mixed'}}]]},
{year:1840,title:'Your Industrial Legacy',brief:'By 1840, industrial production had reshaped many British communities. Entrepreneurs invested in machinery, mills, labor, and trade networks, creating wealth while also exposing workers to hardship and insecurity. New laws, including the 1833 Factory Act, began to regulate certain factory practices and child labor, though conditions remained uneven. More factories competed for markets and capital. The decisions that built a business could also create debts, conflict, or obligations. Your final challenge depends on the enterprise you have developed over decades: its financial resilience, productive capacity, and treatment of people will all influence its legacy.',scenario:s=>s.cash-s.debt<0?'Your business produces goods but owes more than it can comfortably support. Creditors demand a plan for survival.':s.welfare<42?'Your factory has grown, but complaints about treatment and conditions threaten operations and reputation.':'Your business has reached a turning point. You must decide how to secure its position in a changing industrial economy.',choices:[['Expand again','Commit £300 to machinery and larger markets in pursuit of future profit.','You raise capacity further, but a final expansion stretches your finances.',{cash:-300,prod:16,welfare:-5,rep:0,flags:{legacy:'expansion'}}],['Reinvest in people and stability','Spend £240 strengthening safety, training, and production reliability.','Costs rise, but conditions and reputation improve, supporting longer-term resilience.',{cash:-240,prod:5,welfare:14,rep:15,flags:{legacy:'stability'}}],['Consolidate your business','Reduce exposure, sell underused equipment, and preserve cash rather than expand.','You recover money and protect your reserves, but surrender potential production growth.',{cash:160,prod:-8,welfare:0,rep:0,flags:{legacy:'consolidation'}}]]}
];
const thematicSymbols={0: "£", 4: "⚒", 5: "⚖", 6: "⚓", 7: "🚂"};

let state;
function fresh(){state={round:0,cash:1000,debt:0,prod:12,welfare:55,rep:50,flags:{},history:[],events:[],phase:'intro',eventSlots:(()=>{let a=[3,5,7];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a.slice(0,Math.random()<.5?2:3)})()};render()}
function dashboard(){return `<div class="dash"><div class="metric"><span>Cash</span><b>${money(state.cash)}</b></div><div class="metric"><span>Debt</span><b>${money(state.debt)}</b></div><div class="metric"><span>Production</span><b>${clamp(state.prod)}</b></div><div class="metric"><span>Worker welfare</span><b>${clamp(state.welfare)}</b></div><div class="metric"><span>Reputation</span><b>${clamp(state.rep)}</b></div></div>`}
function eventFor(index){let pool=[];if(index===3){pool=[{title:'Low River Levels',description:'A spell of dry weather restricts some water-powered mills.',effect:s=>({cash:s.flags.power==='water'?-190:-35,prod:s.flags.power==='water'?-10:-2})},{title:'Equipment Repair',description:'Maintenance costs arrive earlier than expected.',effect:s=>({cash:s.flags.tech==='heavy'?-175:-65,prod:s.flags.tech==='heavy'?-5:-2})}]}
if(index===5){pool=[{title:'Demand Slump',description:'Textile orders weaken unexpectedly during a difficult trading period.',effect:s=>({cash:s.debt>500?-195:-110,rep:s.flags.labor==='reform'?2:0})},{title:'Labor Disruption',description:'A workplace dispute delays orders.',effect:s=>({cash:s.flags.labor==='harsh'?-170:-65,prod:s.flags.labor==='harsh'?-9:-3})}]}
if(index===7){pool=[{title:'Cotton Price Spike',description:'Merchants unexpectedly raise cotton prices.',effect:s=>({cash:s.flags.trade==='bulk'?-195:s.flags.trade==='diverse'?-75:-105})},{title:'Export Orders Change',description:'A foreign buyer reduces an anticipated order.',effect:s=>({cash:s.flags.trade==='bulk'?-170:-70,prod:s.flags.trade==='bulk'?-6:-2})}]}
const selected=pool[Math.floor(Math.random()*pool.length)];return {...selected,delta:selected.effect(state)}}
function apply(delta){for(const key of ['cash','debt','prod','welfare','rep'])if(delta[key]!==undefined)state[key]=key==='cash'||key==='debt'?state[key]+delta[key]:clamp(state[key]+delta[key]);Object.assign(state.flags,delta.flags||{})}
function profit(){
  // Each round is one simplified accounting period, not a historical ten-year income statement.
  const revenue=Math.round(60+state.prod*4);
  const baselineCosts=Math.round(48+state.prod*1.15);
  const laborAdjustment=state.flags.labor==='reform'?70:state.flags.labor==='harsh'?-30:0;
  const powerCosts=state.flags.power==='steam'?85:state.flags.power==='water'?35:0;
  const interest=Math.round(state.debt*0.045);
  const beforePartner=Math.round(revenue-baselineCosts-laborAdjustment-powerCosts-interest);
  // A partner takes a share of positive earnings, not of sales receipts.
  const partnerShare=state.flags.finance==='partner'?Math.round(Math.max(0,beforePartner)*0.20):0;
  const earnings=beforePartner-partnerShare;
  state.cash+=earnings;
  // Scheduled principal repayment begins the round after initial borrowing.
  const principalPaid=state.flags.finance==='loan'&&state.round>0?Math.min(state.debt,100,Math.max(0,state.cash)):0;
  state.cash-=principalPaid;
  state.debt-=principalPaid;
  return {revenue,baselineCosts,laborAdjustment,powerCosts,interest,partnerShare,earnings,principalPaid};
}
function coverShortfall(){
  // No unexplained negative cash: emergency financing adds an equal liability.
  if(state.cash>=0)return 0;
  const shortfall=Math.ceil(-state.cash);
  state.debt+=shortfall;
  state.cash+=shortfall;
  return shortfall;
}
function decide(i){
  if(state.phase!=='choice')return;
  const round=D[state.round],c=round.choices[i];
  const openingCash=state.cash,openingDebt=state.debt;
  apply(c[3]);
  const income=profit();
  let event=null;
  if(state.eventSlots.includes(state.round)){event=eventFor(state.round);apply(event.delta)}
  const emergencyBorrowing=coverShortfall();
  const record={round:state.round+1,year:round.year,title:round.title,choice:c[0],result:c[2],income:income.earnings,
    breakdown:income,openingCash,openingDebt,closingCash:state.cash,closingDebt:state.debt,emergencyBorrowing,
    event:event?event.title:null,eventText:event?event.description:null,eventDelta:event?event.delta:null};
  state.history.push(record);state.latest=record;state.phase='result';render();
}
function advance(){state.round++;state.phase=state.round>=8?'final':'choice';render();window.scrollTo({top:0,behavior:'smooth'})}
function summary(){let net=state.cash-state.debt;let finance=clamp(Math.round(55+net/65));let business=clamp(Math.round(finance*.48+state.prod*.52));let social=clamp(Math.round(state.welfare*.65+state.rep*.35));let profile=business>=65&&social>=65?'The Balanced Industrialist':business>=65&&social<45?'The Ruthless Tycoon':business>=65?'The Ambitious Industrialist':social>=65?'The Conscientious Entrepreneur':business<40?'The Struggling Proprietor':'The Cautious Manufacturer';return {net,finance,business,social,profile}}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function render(){if(state.phase==='intro'){$.innerHTML=`<div class="topline">The year is 1775 · Your story begins</div><h2>Can you build an industrial business?</h2><p class="intro">You own a small British textile workshop with <strong>£1,000 in cash</strong>. Across eight historical rounds, you will finance expansion, adopt inventions, choose power sources, manage workers, respond to unrest, secure cotton, and reach new markets.</p><div class="brief"><h3>How to play</h3><ol><li>Read the historical briefing and business dilemma.</li><li>Read three options. <strong>Record your choice and prediction on paper before clicking.</strong></li><li>Select a choice to reveal consequences. Earlier decisions influence later scenarios.</li><li>After eight rounds, record your final two scores and entrepreneur profile.</li></ol><p>Cash, debt, production, worker welfare, and reputation change as you play. Operating earnings are calculated after every round. The model deducts recurring costs and financing charges; loan principal repayment lowers debt and cash but is not counted as an operating expense. Two or three unexpected events may occur; their impact depends on earlier choices.</p></div><p class="callout">Every turn represents one simplified business accounting period, NOT all income for the intervening historical decade. Business costs and financial figures are fictional classroom values, not historical price records. The story and individual outcomes are simulated; the historical briefings describe real developments.</p><div class="actions"><button class="btn" onclick="state.phase='choice';render()">Begin the simulation →</button></div>`;return}
if(state.phase==='final'){const z=summary();$.innerHTML=`<div class="topline">Final report · 1840</div><h2>Your Industrial Legacy</h2><div class="roundbadge">${esc(z.profile)}</div>${dashboard()}<div class="scorepair"><div class="score">Business success<strong>${z.business}/100</strong><div class="bar"><div style="width:${z.business}%"></div></div><small>Financial position + productive capacity</small></div><div class="score">Social impact<strong>${z.social}/100</strong><div class="bar"><div style="width:${z.social}%"></div></div><small>Worker welfare + reputation</small></div></div><p><strong>Net financial position:</strong> ${money(z.net)} (cash minus outstanding debt).</p><p>${z.business>=65?'Your enterprise attained substantial productive and business strength.':'Your enterprise faces important financial or productive limitations.'} ${z.social>=65?'Your choices also supported stronger worker welfare and reputation.':z.social<40?'Workers or the public experienced substantial costs associated with your choices.':'The social consequences of your decisions were mixed.'} The most profitable business is not necessarily the one with the best social legacy.</p><h3>Decision history</h3><table class="history"><thead><tr><th>Round</th><th>Your decision</th><th>Outcome</th></tr></thead><tbody>${state.history.map(x=>`<tr><td>${x.round}. ${esc(x.title)}<br><small>${x.year}</small></td><td>${esc(x.choice)}</td><td>${esc(x.result)}<br><small>Operating earnings: ${money(x.income)}; End cash: ${money(x.closingCash)}; End debt: ${money(x.closingDebt)}${x.event?'; Event: '+esc(x.event):''}</small></td></tr>`).join('')}</tbody></table><div class="brief"><h3>Historical reflection</h3><p>Compare your experience with the real entrepreneurial roles of Richard Arkwright and Matthew Boulton. Which invention or investment most increased productive capacity? Which early choice shaped a later problem? How did industrial wealth relate to workers' experiences?</p><p>Record both final scores and your entrepreneur profile on the paper worksheet.</p></div><div class="actions"><button class="btn" onclick="fresh()">Play again — new random events</button><button class="btn secondary" onclick="window.print()">Print final report</button></div>`;return}
const d=D[state.round],picture=historicalPictures[state.round],symbol=thematicSymbols[state.round],head=`<div class="topline">Round ${state.round+1} of 8 · ${d.year}</div><h2>${esc(d.title)}</h2>${dashboard()}`;
if(state.phase==='choice'){$.innerHTML=head+`${!picture&&symbol?`<div class="roundillustration" aria-hidden="true">${symbol}</div>`:""}${picture?`<figure class="historypic"><img src="${picture}" alt="Historical illustration of early industrial machinery from the assigned reading"><figcaption>Historical machinery illustration from your assigned reading</figcaption></figure>`:""}<div class="brief"><h3>Historical briefing</h3><p>${esc(d.brief)}</p></div><p class="scene"><strong>Your situation:</strong> ${esc(d.scenario(state))}</p><p><strong>Record your choice and prediction on paper before selecting.</strong> Known costs are shown; future results are not.</p><div class="choices">${d.choices.map((c,i)=>`<button class="choice" onclick="decide(${i})"><b>${'ABC'[i]}. ${esc(c[0])}</b><small>${esc(c[1])}</small></button>`).join('')}</div><p class="callout">All choices carry potential advantages and costs. Earlier choices may change the situation and event impacts in later rounds.</p>`;return}
const r=state.latest;$.innerHTML=head+`<div class="result"><div class="roundbadge">Decision recorded</div><h3>${esc(r.choice)}</h3><p>${esc(r.result)}</p><p><strong>Operating earnings this round:</strong> ${money(r.income)}.<br><small>Receipts ${money(r.breakdown.revenue)} − operating costs ${money(r.breakdown.baselineCosts)} − extra labor costs ${money(r.breakdown.laborAdjustment)} − power costs ${money(r.breakdown.powerCosts)} − interest ${money(r.breakdown.interest)} − partner share ${money(r.breakdown.partnerShare)} = ${money(r.income)}.</small><br><small>Loan principal paid: ${money(r.breakdown.principalPaid)} (reduces both cash and debt). Emergency borrowing: ${money(r.emergencyBorrowing)} (increases debt).</small><br><strong>Ending cash:</strong> ${money(r.closingCash)} &nbsp; <strong>Ending debt:</strong> ${money(r.closingDebt)}. </p></div>${r.event?`<div class="event"><h3>Unexpected event: ${esc(r.event)}</h3><p>${esc(r.eventText)} Its effect is adjusted to your previous choices.</p></div>`:''}<p class="callout">These outcomes are fictional model consequences designed to illustrate historical trade-offs, not guaranteed real-world effects.</p><div class="actions"><button class="btn" onclick="advance()">${state.round===7?'View final report':'Continue to next round'} →</button></div>`}
fresh();
</script></body></html>
